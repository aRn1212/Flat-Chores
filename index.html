<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turni di Pulizia</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #14161a;
    --muted: #6b7280;
    --line: #e4e7eb;
    --accent: #3b6ef5;
    --accent-soft: #eaf0ff;
    --shadow: 0 1px 2px rgba(16,20,30,.06), 0 8px 24px rgba(16,20,30,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --ink: #e9ecf1;
      --muted: #9aa2b1;
      --line: #262b35;
      --accent: #7aa2ff;
      --accent-soft: #1c2436;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }

  header { margin-bottom: 24px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }

  .weekbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 20px 0 28px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .weekbar .range { font-weight: 600; margin-right: auto; }
  .weekbar .range small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  button {
    font: inherit; font-size: 14px; color: var(--ink);
    background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
  button[disabled] { opacity: .45; cursor: default; }
  button[disabled]:hover { border-color: var(--line); color: var(--ink); }

  @media (max-width: 460px) {
    .weekbar { gap: 8px; }
    .weekbar .range { flex-basis: 100%; margin-right: 0; }
  }

  /* Schede verticali: nome, emoji, faccenda, dettaglio impilati. */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .card {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px 16px 26px; box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 18px; font-size: 17px; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  ul.chores { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; width: 100%; }
  ul.chores li { display: block; }
  .emoji {
    font-size: 46px; line-height: 1; display: block; margin-bottom: 12px;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .chore-name { font-weight: 600; font-size: 16px; }
  .chore-detail { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .card.off { opacity: .82; }
  .card.off .emoji { filter: grayscale(.15); }
  .free { color: var(--muted); font-size: 14px; font-style: italic; margin: 0; }

  details.cycle { margin-top: 32px; }
  details.cycle summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  tr.now td { background: var(--accent-soft); }
  td.off { color: var(--muted); font-style: italic; }
  .scroller { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Turni di Pulizia</h1>
    <p class="sub">Chi pulisce cosa questa settimana. Si ruota ogni lunedì.</p>
  </header>

  <div class="weekbar">
    <div class="range">
      <span id="week-range">&nbsp;</span>
      <small id="week-note">&nbsp;</small>
    </div>
    <button id="prev" title="Settimana precedente">&larr; Prec.</button>
    <button id="today" class="primary">Questa settimana</button>
    <button id="next" title="Settimana successiva">Succ. &rarr;</button>
  </div>

  <div class="grid" id="grid"></div>

  <details class="cycle">
    <summary>Vedi tutta la rotazione</summary>
    <div class="scroller"><table id="cycle-table"></table></div>
  </details>

</div>

<script>
/* ============================================================
   DA MODIFICARE QUI - al resto ci pensa la pagina da sola.
   ============================================================ */

// Due squadre, ognuna con le sue faccende. Le faccende girano solo
// dentro la squadra: tre persone e tre faccende, quindi ognuno le fa
// tutte e tre nel giro di tre settimane e nessuno ripete la stessa
// faccenda due settimane di fila.
//
// L'ordine di "persone" e quello di "faccende" insieme decidono chi fa
// cosa nella settimana di partenza: la prima persona fa la prima
// faccenda, la seconda la seconda, e così via.
const SQUADRE = [
  {
    persone: ["Simone", "Salvatore", "Aurelio"],
    faccende: [
      { emoji: "🚽", name: "Bagno",      detail: "WC, doccia, lavandino, specchio" },
      { emoji: "🍳", name: "Cucina 1",   detail: "Da lunedì a mercoledì" },
      { emoji: "🗑️", name: "Spazzatura", detail: "2 volte a settimana" }
    ]
  },
  {
    persone: ["Antonio", "Aran", "Ali"],
    faccende: [
      { emoji: "🚽", name: "Bagno",     detail: "WC, doccia, lavandino, specchio" },
      { emoji: "🍳", name: "Cucina 2",  detail: "Da giovedì a domenica" },
      { emoji: "🧹", name: "Corridoio", detail: "Scopare e lavare, ingresso" }
    ]
  }
];

// Cosa vede chi in quella settimana non ha niente da fare.
// (Adesso non capita mai: sei persone e sei faccende.)
const SETTIMANA_LIBERA = { emoji: "😎", text: "Settimana libera" };

// Il lunedì da cui parte il conto: [anno, mese 1-12, giorno].
// Questa è la settimana 7-13 settembre 2026, quella del piano di partenza.
const LUNEDI_DI_PARTENZA = [2026, 9, 7];

/* ============================================================
   Da qui in giù non serve toccare niente.
   ============================================================ */

const GIORNO = 86400000;
const SETTIMANA = 7 * GIORNO;
const LOCALE = "it-IT";
const PALETTE = ["#3b6ef5", "#e0703a", "#2fa66b", "#a25fd0", "#d94f7a", "#0f9bb0", "#c9a227", "#5d6bd0"];

const COINQUILINI = SQUADRE.flatMap(s => s.persone);
const TUTTE_LE_FACCENDE = SQUADRE.flatMap(s => s.faccende);
const PUO_ESSERCI_LIBERO = TUTTE_LE_FACCENDE.length < COINQUILINI.length;

const epoca = lunediDi(new Date(LUNEDI_DI_PARTENZA[0], LUNEDI_DI_PARTENZA[1] - 1, LUNEDI_DI_PARTENZA[2]));
let lunediMostrato = lunediDi(new Date());

function mod(a, b) { return ((a % b) + b) % b; }

function lunediDi(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const scarto = (x.getDay() + 6) % 7; // domenica(0) -> 6, lunedì(1) -> 0
  x.setDate(x.getDate() - scarto);
  return x;
}

function numeroSettimana(lunedi) {
  return Math.round((lunedi - epoca) / SETTIMANA);
}

// Assegna le faccende della settimana. Restituisce una lista per persona.
function assegnazioni(lunedi) {
  const w = numeroSettimana(lunedi);
  const perPersona = COINQUILINI.map(() => []);

  SQUADRE.forEach(squadra => {
    const quanti = squadra.persone.length;
    if (!quanti) return;
    squadra.faccende.forEach((faccenda, j) => {
      const nome = squadra.persone[mod(j + w, quanti)];
      const i = COINQUILINI.indexOf(nome);
      if (i >= 0) perPersona[i].push(faccenda);
    });
  });

  return perPersona;
}

function formattaSettimana(lunedi) {
  const domenica = new Date(lunedi.getTime() + 6 * GIORNO);
  const stessoMese = lunedi.getMonth() === domenica.getMonth();
  const a = lunedi.toLocaleDateString(LOCALE,
    stessoMese ? { day: "numeric" } : { day: "numeric", month: "short" });
  const b = domenica.toLocaleDateString(LOCALE, { day: "numeric", month: "short", year: "numeric" });
  return a + " – " + b;
}

function render() {
  const lunediCorrente = lunediDi(new Date());
  const scarto = Math.round((lunediMostrato - lunediCorrente) / SETTIMANA);

  document.getElementById("week-range").textContent = formattaSettimana(lunediMostrato);
  document.getElementById("week-note").textContent =
    scarto === 0 ? "Questa settimana" :
    scarto === 1 ? "Prossima settimana" :
    scarto === -1 ? "Settimana scorsa" :
    scarto > 0 ? "Tra " + scarto + " settimane" : Math.abs(scarto) + " settimane fa";
  document.getElementById("today").disabled = scarto === 0;

  const perPersona = assegnazioni(lunediMostrato);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  COINQUILINI.forEach((nome, i) => {
    const compiti = perPersona[i];
    const card = document.createElement("div");
    card.className = compiti.length ? "card" : "card off";

    const h2 = document.createElement("h2");
    const pallino = document.createElement("span");
    pallino.className = "dot";
    pallino.style.background = PALETTE[i % PALETTE.length];
    h2.append(pallino, document.createTextNode(nome));
    card.appendChild(h2);

    if (compiti.length === 0) {
      card.appendChild(emojiEl(SETTIMANA_LIBERA.emoji));
      const p = document.createElement("p");
      p.className = "free";
      p.textContent = SETTIMANA_LIBERA.text;
      card.appendChild(p);
    } else {
      const ul = document.createElement("ul");
      ul.className = "chores";
      compiti.forEach(compito => {
        const li = document.createElement("li");
        if (compito.emoji) li.appendChild(emojiEl(compito.emoji));
        const nm = document.createElement("div");
        nm.className = "chore-name";
        nm.textContent = compito.name;
        li.appendChild(nm);
        if (compito.detail) {
          const dt = document.createElement("div");
          dt.className = "chore-detail";
          dt.textContent = compito.detail;
          li.appendChild(dt);
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    grid.appendChild(card);
  });

  renderRotazione(lunediCorrente);
}

function emojiEl(carattere) {
  const el = document.createElement("span");
  el.className = "emoji";
  el.setAttribute("role", "img");
  el.setAttribute("aria-hidden", "true");
  el.textContent = carattere;
  return el;
}

function mcd(a, b) { return b ? mcd(b, a % b) : a; }
function mcm(a, b) { return (a && b) ? a * b / mcd(a, b) : (a || b || 1); }

// Quante settimane prima che tutto ricominci uguale.
function lunghezzaCiclo() {
  let n = 1;
  SQUADRE.forEach(s => { if (s.persone.length) n = mcm(n, s.persone.length); });
  return Math.min(Math.max(n, 1), 24);
}

function renderRotazione(lunediCorrente) {
  const tabella = document.getElementById("cycle-table");
  tabella.innerHTML = "";

  const testa = tabella.insertRow();
  testa.appendChild(th("Settimana"));
  TUTTE_LE_FACCENDE.forEach(f => testa.appendChild(th((f.emoji ? f.emoji + " " : "") + f.name)));
  if (PUO_ESSERCI_LIBERO) testa.appendChild(th("Libero"));

  const righe = lunghezzaCiclo();
  for (let k = 0; k < righe; k++) {
    const lunedi = new Date(lunediMostrato.getTime() + k * SETTIMANA);
    const riga = tabella.insertRow();
    if (lunedi.getTime() === lunediCorrente.getTime()) riga.className = "now";
    riga.insertCell().textContent = formattaSettimana(lunedi);

    const perPersona = assegnazioni(lunedi);
    TUTTE_LE_FACCENDE.forEach(faccenda => {
      const i = perPersona.findIndex(lista => lista.includes(faccenda));
      riga.insertCell().textContent = i >= 0 ? COINQUILINI[i] : "—";
    });

    if (PUO_ESSERCI_LIBERO) {
      const cella = riga.insertCell();
      cella.className = "off";
      cella.textContent = COINQUILINI.filter((_, i) => perPersona[i].length === 0).join(", ") || "—";
    }
  }
}

function th(testo) {
  const el = document.createElement("th");
  el.textContent = testo;
  return el;
}

function vai(settimane) {
  lunediMostrato = new Date(lunediMostrato.getTime() + settimane * SETTIMANA);
  render();
}

document.getElementById("prev").addEventListener("click", () => vai(-1));
document.getElementById("next").addEventListener("click", () => vai(1));
document.getElementById("today").addEventListener("click", () => {
  lunediMostrato = lunediDi(new Date());
  render();
});

render();
</script>
</body>
</html>
